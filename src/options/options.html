<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceWatch — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>

<h1>PriceWatch Settings</h1>

<!-- Notifications -->
<div class="section">
  <h2>Notifications</h2>
  <div id="notif-status" class="notif-status"></div>
  <button id="btn-request-notif" class="btn btn-secondary" style="display:none">
    Enable notifications
  </button>

  <div class="toggle-row" style="margin-top:12px">
    <span>Price drop alerts</span>
    <label class="toggle">
      <input type="checkbox" id="notif-enabled">
      <span class="toggle-slider"></span>
    </label>
  </div>
  <div class="toggle-row">
    <span>Back-in-stock alerts</span>
    <label class="toggle">
      <input type="checkbox" id="notif-stock" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>
</div>

<!-- Check defaults -->
<div class="section">
  <h2>Defaults</h2>
  <div class="field">
    <label for="default-interval">Default check interval</label>
    <select id="default-interval">
      <option value="5">5 minutes</option>
      <option value="15" selected>15 minutes</option>
      <option value="30">30 minutes</option>
      <option value="60">1 hour</option>
    </select>
  </div>
  <div class="field">
    <label for="default-currency">Default currency</label>
    <select id="default-currency">
      <option value="USD">USD — US Dollar</option>
      <option value="EUR">EUR — Euro</option>
      <option value="GBP">GBP — British Pound</option>
      <option value="JPY">JPY — Japanese Yen</option>
      <option value="CAD">CAD — Canadian Dollar</option>
      <option value="AUD">AUD — Australian Dollar</option>
      <option value="CHF">CHF — Swiss Franc</option>
      <option value="CNY">CNY — Chinese Yuan</option>
      <option value="INR">INR — Indian Rupee</option>
      <option value="BRL">BRL — Brazilian Real</option>
      <option value="PLN">PLN — Polish Zloty</option>
      <option value="KRW">KRW — South Korean Won</option>
    </select>
  </div>
  <div class="field">
    <label for="history-max">Max history points per product</label>
    <input type="number" id="history-max" min="50" max="5000" value="500">
  </div>
</div>

<!-- Data management -->
<div class="section">
  <h2>Data</h2>
  <div class="btn-row">
    <button id="btn-export" class="btn btn-secondary">Export data</button>
    <button id="btn-import" class="btn btn-secondary">Import data</button>
    <button id="btn-clear" class="btn btn-danger">Clear all data</button>
  </div>
  <input type="file" id="file-input" accept=".json" style="display:none">
  <div id="data-status" class="status-msg hidden"></div>
</div>

<!-- Save -->
<div style="margin-top: 8px">
  <button id="btn-save" class="btn btn-primary">Save settings</button>
  <span id="save-status" class="status-msg hidden" style="margin-left:12px"></span>
</div>

<script type="module" src="options.js"></script>
</body>
</html>
